name: Manual Kind E2E

on:
  workflow_dispatch:
    inputs:
      frontend_forge_controller_image:
        description: Frontend Forge controller image
        required: true
        type: string
      frontend_forge_runner_image:
        description: Frontend Forge runner image
        required: true
        type: string
      frontend_forge_image:
        description: Frontend Forge build-service image
        required: true
        type: string
      kubernetes_version:
        description: Optional Kubernetes version (1.23, 1.26, 1.28, 1.30, 1.32, 1.34)
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      KIND_CLUSTER_NAME: frontend-forge-e2e-${{ matrix.arch }}
      ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts/${{ matrix.arch }}
      RENDERED_MANIFEST_DIR: ${{ runner.temp }}/e2e-manifests/${{ matrix.arch }}
      FRONTEND_FORGE_CONTROLLER_IMAGE: ${{ inputs.frontend_forge_controller_image }}
      FRONTEND_FORGE_RUNNER_IMAGE: ${{ inputs.frontend_forge_runner_image }}
      FRONTEND_FORGE_IMAGE: ${{ inputs.frontend_forge_image }}
      KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) KIND_ARCH=amd64 ;;
            aarch64|arm64) KIND_ARCH=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-${KIND_ARCH}"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Resolve kind node image
        id: kind-image
        shell: bash
        run: |
          set -euo pipefail
          version="${KUBERNETES_VERSION}"
          case "$version" in
            "")
              echo "kind_node_image=" >> "$GITHUB_OUTPUT"
              echo "version_label=kind-default" >> "$GITHUB_OUTPUT"
              ;;
            "1.23")
              echo "kind_node_image=kindest/node:v1.23.17" >> "$GITHUB_OUTPUT"
              echo "version_label=1.23" >> "$GITHUB_OUTPUT"
              ;;
            "1.26")
              echo "kind_node_image=kindest/node:v1.26.15" >> "$GITHUB_OUTPUT"
              echo "version_label=1.26" >> "$GITHUB_OUTPUT"
              ;;
            "1.28")
              echo "kind_node_image=kindest/node:v1.28.15" >> "$GITHUB_OUTPUT"
              echo "version_label=1.28" >> "$GITHUB_OUTPUT"
              ;;
            "1.30")
              echo "kind_node_image=kindest/node:v1.30.13" >> "$GITHUB_OUTPUT"
              echo "version_label=1.30" >> "$GITHUB_OUTPUT"
              ;;
            "1.32")
              echo "kind_node_image=kindest/node:v1.32.11" >> "$GITHUB_OUTPUT"
              echo "version_label=1.32" >> "$GITHUB_OUTPUT"
              ;;
            "1.34")
              echo "kind_node_image=kindest/node:v1.34.3" >> "$GITHUB_OUTPUT"
              echo "version_label=1.34" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported kubernetes_version: ${version}" >&2
              echo "supported versions: 1.23, 1.26, 1.28, 1.30, 1.32, 1.34" >&2
              exit 1
              ;;
          esac

      - name: Create kind cluster
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.kind-image.outputs.kind_node_image }}" ]]; then
            kind create cluster \
              --name "${KIND_CLUSTER_NAME}" \
              --image "${{ steps.kind-image.outputs.kind_node_image }}" \
              --wait 5m
          else
            kind create cluster \
              --name "${KIND_CLUSTER_NAME}" \
              --wait 5m
          fi
          kubectl get nodes -o wide

      - name: Pull test images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${FRONTEND_FORGE_CONTROLLER_IMAGE}"
          docker pull "${FRONTEND_FORGE_RUNNER_IMAGE}"
          docker pull "${FRONTEND_FORGE_IMAGE}"

      - name: Load images into kind
        shell: bash
        run: |
          set -euo pipefail
          kind load docker-image --name "${KIND_CLUSTER_NAME}" "${FRONTEND_FORGE_CONTROLLER_IMAGE}"
          kind load docker-image --name "${KIND_CLUSTER_NAME}" "${FRONTEND_FORGE_RUNNER_IMAGE}"
          kind load docker-image --name "${KIND_CLUSTER_NAME}" "${FRONTEND_FORGE_IMAGE}"

      - name: Render e2e manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RENDERED_MANIFEST_DIR}"
          cp -R config/e2e/. "${RENDERED_MANIFEST_DIR}/"
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = Path(os.environ["RENDERED_MANIFEST_DIR"])
          replacements = {
              "${FRONTEND_FORGE_CONTROLLER_IMAGE}": os.environ["FRONTEND_FORGE_CONTROLLER_IMAGE"],
              "${FRONTEND_FORGE_RUNNER_IMAGE}": os.environ["FRONTEND_FORGE_RUNNER_IMAGE"],
              "${FRONTEND_FORGE_IMAGE}": os.environ["FRONTEND_FORGE_IMAGE"],
          }

          for name in ("controller-deployment-ci.yaml", "frontend-forge-build-service.yaml"):
              path = base / name
              text = path.read_text()
              for needle, value in replacements.items():
                  text = text.replace(needle, value)
              path.write_text(text)
          PY

      - name: Run kind e2e
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci-kind-e2e.sh
          ARTIFACT_DIR="${ARTIFACT_DIR}" \
          E2E_MANIFEST_DIR="${RENDERED_MANIFEST_DIR}" \
          KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
          ./scripts/ci-kind-e2e.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-kind-${{ matrix.arch }}-${{ steps.kind-image.outputs.version_label }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
