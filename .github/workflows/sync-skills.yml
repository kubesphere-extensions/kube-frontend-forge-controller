name: Sync Skills

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-skills.yml'
      - 'skills/frontend-forge-fe-operations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-skills:
    runs-on: self-runner-extensions
    env:
      SOURCE_REPO: ${{ github.event.repository.name }}
      TARGET_REPO: kubesphere/kubesphere
      TARGET_PUSH_REPO: ks-ci-bot/kubesphere
      TARGET_BASE_BRANCH: master
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: sync
        env:
          GH_TOKEN: ${{ secrets.CIBOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SKILL_NAMES=(
            frontend-forge-fe-operations
          )

          for skill_name in "${SKILL_NAMES[@]}"; do
            if [[ ! -d "skills/${skill_name}" ]]; then
              echo "Source skill directory does not exist: skills/${skill_name}" >&2
              exit 1
            fi
          done

          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          SAFE_SOURCE_REPO="$(printf '%s' "${SOURCE_REPO}" | tr -cd '[:alnum:]_-')"
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          if [[ -z "${SAFE_SOURCE_REPO}" ]]; then
            echo "Failed to derive a safe branch name from SOURCE_REPO=${SOURCE_REPO}" >&2
            exit 1
          fi

          SOURCE_PR_NUMBER="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0].number // ""' 2>/dev/null || true
          )"
          SOURCE_PR_NUMBER="$(printf '%s' "${SOURCE_PR_NUMBER}" | tr -cd '0-9')"
          SOURCE_PR_URL="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0].html_url // ""' 2>/dev/null || true
          )"
          if [[ -n "${SOURCE_PR_NUMBER}" ]]; then
            SYNC_BRANCH="sync/${SAFE_SOURCE_REPO}-skills-pr-${SOURCE_PR_NUMBER}"
          else
            SYNC_BRANCH="sync/${SAFE_SOURCE_REPO}-skills-${SHORT_SHA}"
          fi
          SYNC_TITLE="[skills] ${COMMIT_SUBJECT}"
          MESSAGE_FILE="${RUNNER_TEMP}/sync-skills-message.txt"
          if [[ -n "${SOURCE_PR_URL}" ]]; then
            PR_BODY="Source PR: ${SOURCE_PR_URL}"
          else
            PR_BODY="Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi

          printf '%s\n' "${SYNC_TITLE}" > "${MESSAGE_FILE}"
          printf 'sync_branch=%s\n' "${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"
          {
            echo 'sync_title<<EOF_DELIM'
            echo "${SYNC_TITLE}"
            echo 'EOF_DELIM'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'pr_body<<EOF_DELIM'
            echo "${PR_BODY}"
            echo 'EOF_DELIM'
          } >> "$GITHUB_OUTPUT"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_PUSH_REPO}.git" -b "${TARGET_BASE_BRANCH}" target-repo
          pushd target-repo
          git config user.email "ci-bot@kubesphere.io"
          git config user.name "ks-ci-bot"
          git remote add upstream "https://github.com/${TARGET_REPO}.git"
          git fetch upstream "${TARGET_BASE_BRANCH}"
          git checkout -B "${SYNC_BRANCH}" "upstream/${TARGET_BASE_BRANCH}"
          popd

          for skill_name in "${SKILL_NAMES[@]}"; do
            rm -rf "target-repo/skills/${skill_name}"
            mkdir -p "target-repo/skills/${skill_name}"
            cp -R "skills/${skill_name}/." "target-repo/skills/${skill_name}/"
          done

          pushd target-repo
          for skill_name in "${SKILL_NAMES[@]}"; do
            git add "skills/${skill_name}"
          done
          if git diff --cached --quiet; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -F "${MESSAGE_FILE}"
          git fetch origin "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          if REMOTE_SYNC_SHA="$(git rev-parse --verify "refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null)"; then
            git push origin "${SYNC_BRANCH}" --force-with-lease="refs/heads/${SYNC_BRANCH}:${REMOTE_SYNC_SHA}"
          else
            git push origin "${SYNC_BRANCH}" --force-with-lease="refs/heads/${SYNC_BRANCH}:"
          fi
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.CIBOT_ACCESS_TOKEN }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          SYNC_TITLE: ${{ steps.sync.outputs.sync_title }}
          PR_BODY: ${{ steps.sync.outputs.pr_body }}
          TARGET_REPO: kubesphere/kubesphere
          TARGET_BASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail

          pushd target-repo
          EXISTING_PR_NUMBER="$(
            gh pr ls \
              -R "${TARGET_REPO}" \
              -A ks-ci-bot \
              -H "${SYNC_BRANCH}" \
              -B "${TARGET_BASE_BRANCH}" \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [[ -n "${EXISTING_PR_NUMBER}" ]]; then
            gh pr edit "${EXISTING_PR_NUMBER}" \
              -R "${TARGET_REPO}" \
              --title "${SYNC_TITLE}" \
              --body "${PR_BODY}"
          else
            gh pr create \
              -R "${TARGET_REPO}" \
              -B "${TARGET_BASE_BRANCH}" \
              -H "ks-ci-bot:${SYNC_BRANCH}" \
              -t "${SYNC_TITLE}" \
              -b "${PR_BODY}"
          fi
