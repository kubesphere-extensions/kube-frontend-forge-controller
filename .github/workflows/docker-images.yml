name: Build And Push Docker Images

on:
  # Build images when PRs into these branches are closed (merged).
  pull_request:
    branches:
      - main
      - dev
      - release/*
      - hotfix/*
    types:
      - closed
  # Build images when a GitHub Release is published.
  release:
    types:
      - published

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 'kubespheredev' || 'kubesphere' }}
  KUBESPHERE_HUB_REGISTRY: hub.kubesphere.com.cn

jobs:
  build-by-arch:
    if: ${{ github.event_name == 'release' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: Build ${{ matrix.image_name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64（原生）
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-extension-controller
            dockerfile: crates/frontend-extension-controller/Dockerfile
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-forge-extension-packager
            dockerfile: crates/extension-packager/Dockerfile
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-forge-extension-publisher
            dockerfile: crates/extension-publisher/Dockerfile
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-forge-controller
            dockerfile: crates/frontend-forge-controller/Dockerfile
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-forge-runner
            dockerfile: crates/frontend-forge-runner/Dockerfile
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            image_name: frontend-forge-extension-api
            dockerfile: crates/frontend-forge-extension-api/Dockerfile

          # arm64（原生 ARM runner，无需 QEMU）
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-extension-controller
            dockerfile: crates/frontend-extension-controller/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-forge-extension-packager
            dockerfile: crates/extension-packager/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-forge-extension-publisher
            dockerfile: crates/extension-publisher/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-forge-controller
            dockerfile: crates/frontend-forge-controller/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-forge-runner
            dockerfile: crates/frontend-forge-runner/Dockerfile
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            image_name: frontend-forge-extension-api
            dockerfile: crates/frontend-forge-extension-api/Dockerfile

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log In To KubeSphere Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KUBESPHERE_HUB_REGISTRY }}
          username: ${{ secrets.KUBESPHERE_HUB_USERNAME }}
          password: ${{ secrets.KUBESPHERE_HUB_TOKEN }}

      # 单平台 build + push（按 digest 推送，不直接 push tag）
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          # 关键：push-by-digest + name-canonical，让 action 输出 image digest 供 merge 用
          outputs: |
            type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.KUBESPHERE_HUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image_name }}-${{ matrix.arch }}

      # 把 digest 写到 artifact，merge job 统一合成 multi-arch
      - name: Export digest
        shell: bash
        run: |
          mkdir -p digests
          # steps.build.outputs.digest 形如 "sha256:...."
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image_name }}-${{ matrix.arch }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image_name }}-${{ matrix.arch }}
          path: digests/*.txt

  merge-manifests:
    if: ${{ github.event_name == 'release' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: [build-by-arch]

    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log In To KubeSphere Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KUBESPHERE_HUB_REGISTRY }}
          username: ${{ secrets.KUBESPHERE_HUB_USERNAME }}
          password: ${{ secrets.KUBESPHERE_HUB_TOKEN }}

      - name: Create and push manifest lists
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Multi-platform image digests"
            echo
            echo "| Registry | Image | Tags | Digest | Canonical Reference |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for image_name in \
            frontend-extension-controller \
            frontend-forge-extension-packager \
            frontend-forge-extension-publisher \
            frontend-forge-controller \
            frontend-forge-runner \
            frontend-forge-extension-api; do
            amd_digest="$(cat "digests/${image_name}-amd64.txt")"
            arm_digest="$(cat "digests/${image_name}-arm64.txt")"

            for registry in docker.io "${KUBESPHERE_HUB_REGISTRY}"; do
              repo="${registry}/${DOCKERHUB_NAMESPACE}/${image_name}"

              if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
                tags=("${repo}:${GITHUB_REF_NAME}")
              else
                base_ref="${GITHUB_BASE_REF}"
                safe_base_ref="${base_ref//\//-}"
                tags=("${repo}:${safe_base_ref}" "${repo}:latest")
              fi

              # 一次性合并两个平台 digest，并同时挂上所有最终 tags。
              primary_tag="${tags[0]}"
              tag_args=()
              for t in "${tags[@]}"; do
                tag_args+=("-t" "${t}")
              done

              docker buildx imagetools create \
                "${tag_args[@]}" \
                "${repo}@${amd_digest}" \
                "${repo}@${arm_digest}"

              multiarch_digest="$(docker buildx imagetools inspect "${primary_tag}" | sed -n 's/^Digest: //p' | head -n1)"
              canonical_ref="${repo}@${multiarch_digest}"
              joined_tags="$(printf '%s<br>' "${tags[@]}")"
              joined_tags="${joined_tags%<br>}"

              echo "multi-platform image digest: ${image_name} -> ${canonical_ref}"
              echo "| ${registry} | ${image_name} | ${joined_tags} | \`${multiarch_digest}\` | \`${canonical_ref}\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
