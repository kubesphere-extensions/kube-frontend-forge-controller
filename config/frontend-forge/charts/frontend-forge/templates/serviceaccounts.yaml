    {{- include "frontend-forge.componentLabels" (dict "root" . "component" "runtime-runner") | nindent 4 }}
  {{- with .Values.runner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.runner.serviceAccount.automount }}
---
{{- end }}
