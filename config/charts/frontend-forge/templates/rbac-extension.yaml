{{- if .Values.frontendExtensionController.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-extension-controller
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-extension-controller" "component" "extension-controller") | nindent 4 }}
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-extension-controller
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-extension-controller" "component" "extension-controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-extension-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.extensionControllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-packager-fe-reader
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-packager" "component" "extension-packager") | nindent 4 }}
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-packager-fe-reader
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-packager" "component" "extension-packager") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-packager-fe-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.extensionPackagerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-forge-extension-packager-artifact-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-packager" "component" "extension-packager") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-forge-extension-packager-artifact-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-packager" "component" "extension-packager") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-forge-extension-packager-artifact-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.extensionPackagerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-publisher
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-publisher" "component" "extension-publisher") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-publisher
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-publisher" "component" "extension-publisher") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-publisher
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.extensionPublisherServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.frontendForgeExtensionApi.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-api
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-api" "component" "extension-api") | nindent 4 }}
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions"]
    verbs: ["create", "get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-api
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-extension-api" "component" "extension-api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-api
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.extensionApiServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
