{{- if .Values.extensionApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend-forge.extensionApiServiceName" . }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "component" "extension-api") | nindent 4 }}
spec:
  replicas: {{ .Values.extensionApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "frontend-forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: extension-api
  template:
    metadata:
      {{- with .Values.extensionApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "frontend-forge.labels" . | nindent 8 }}
        app.kubernetes.io/component: extension-api
        {{- with .Values.extensionApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (default .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "frontend-forge.extensionApiServiceAccountName" . }}
      {{- with .Values.extensionApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend-forge-extension-api
          {{- with .Values.extensionApi.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "frontend-forge.image" (dict "root" . "image" .Values.extensionApi.image) | quote }}
          imagePullPolicy: {{ .Values.extensionApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: EXTENSION_API_BIND_ADDR
              value: {{ .Values.extensionApi.bindAddr | quote }}
            - name: EXTENSION_API_GROUP
              value: {{ .Values.extensionApi.apiService.group | quote }}
            - name: EXTENSION_API_VERSION
              value: {{ .Values.extensionApi.apiService.version | quote }}
          {{- with .Values.extensionApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extensionApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extensionApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extensionApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend-forge.extensionApiServiceName" . }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "component" "extension-api") | nindent 4 }}
spec:
  type: {{ .Values.extensionApi.service.type }}
  selector:
    {{- include "frontend-forge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: extension-api
  ports:
    - name: http
      port: {{ .Values.extensionApi.service.port }}
      targetPort: http
{{- end }}
