{{- if .Values.frontendForgeController.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-controller
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-controller" "component" "runtime-controller") | nindent 4 }}
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendintegrations"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendintegrations/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["extensions.kubesphere.io"]
    resources: ["jsbundles"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["extensions.kubesphere.io"]
    resources: ["jsbundles/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-controller
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-controller" "component" "runtime-controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-runner-fi-reader
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendintegrations"]
    verbs: ["get"]
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendintegrations/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-runner-fi-reader
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-runner-fi-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-forge-runner-config-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-forge-runner-config-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-forge-runner-config-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-runner-jsbundle-writer
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
rules:
  - apiGroups: ["extensions.kubesphere.io"]
    resources: ["jsbundles"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["extensions.kubesphere.io"]
    resources: ["jsbundles/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-runner-jsbundle-writer
  labels:
    {{- include "frontend-forge.componentLabels" (dict "root" . "name" "frontend-forge-runner" "component" "runtime-runner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-runner-jsbundle-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "frontend-forge.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
