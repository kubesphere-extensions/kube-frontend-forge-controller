apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-forge-extension-api
  namespace: extension-frontend-forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-forge-extension-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-forge-extension-api
    spec:
      serviceAccountName: frontend-forge-extension-api
      containers:
        - name: frontend-forge-extension-api
          image: ghcr.io/example/frontend-forge-extension-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: EXTENSION_API_BIND_ADDR
              value: 0.0.0.0:8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-forge-extension-api
  namespace: extension-frontend-forge
spec:
  selector:
    app.kubernetes.io/name: frontend-forge-extension-api
  ports:
    - name: http
      port: 80
      targetPort: http
