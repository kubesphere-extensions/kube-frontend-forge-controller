apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-extension-controller
  namespace: extension-frontend-forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-extension-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-extension-controller
    spec:
      serviceAccountName: frontend-extension-controller
      containers:
        - name: extension-controller
          image: ghcr.io/example/frontend-extension-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PACKAGER_IMAGE
              value: spike2044/frontend-forge-extension-packager:latest
            - name: PACKAGER_SERVICE_ACCOUNT
              value: frontend-forge-extension-packager
            - name: PUBLISHER_IMAGE
              value: spike2044/frontend-forge-extension-publisher:latest
            - name: PUBLISHER_SERVICE_ACCOUNT
              value: frontend-forge-extension-publisher
            - name: ARTIFACT_CONFIGMAP_NAMESPACE
              value: extension-frontend-forge
            - name: RECONCILE_REQUEUE_SECONDS
              value: "5"
            - name: JOB_ACTIVE_DEADLINE_SECONDS
              value: "300"
            - name: JOB_TTL_SECONDS_AFTER_FINISHED
              value: "3600"
