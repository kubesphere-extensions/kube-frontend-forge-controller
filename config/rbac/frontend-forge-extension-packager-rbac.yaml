apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-forge-extension-packager
  namespace: extension-frontend-forge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-packager-fe-reader
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-packager-fe-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-packager-fe-reader
subjects:
  - kind: ServiceAccount
    name: frontend-forge-extension-packager
    namespace: extension-frontend-forge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-forge-extension-packager-artifact-writer
  namespace: extension-frontend-forge
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-forge-extension-packager-artifact-writer
  namespace: extension-frontend-forge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-forge-extension-packager-artifact-writer
subjects:
  - kind: ServiceAccount
    name: frontend-forge-extension-packager
    namespace: extension-frontend-forge
