apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-forge-extension-publisher
  namespace: extension-frontend-forge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-publisher
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-publisher
subjects:
  - kind: ServiceAccount
    name: frontend-forge-extension-publisher
    namespace: extension-frontend-forge
