apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-forge-extension-api
  namespace: extension-frontend-forge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontend-forge-extension-api
rules:
  - apiGroups: ["frontend-forge.kubesphere.io"]
    resources: ["frontendextensions"]
    verbs: ["create", "get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-forge-extension-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-forge-extension-api
subjects:
  - kind: ServiceAccount
    name: frontend-forge-extension-api
    namespace: extension-frontend-forge
