apiVersion: frontend-forge.kubesphere.io/v1alpha1
kind: FrontendIntegration
metadata:
  name: fi-crdtable-testdata
  annotations:
    kubesphere.io/creator: admin
    kubesphere.io/description: Test CRD tables for cluster-scoped and namespaced resources
spec:
  displayName: FI CRD Table Test Data
  enabled: true
  menus:
    - displayName: Test Cluster CRDs
      key: test-cluster-crds
      placement: cluster
      type: organization
      children:
        - displayName: Cluster Widgets
          key: cluster-widgets
        - displayName: Cluster Reports
          key: cluster-reports
    - displayName: Test Namespace CRDs
      key: test-namespace-crds
      placement: workspace
      type: organization
      children:
        - displayName: Namespace Widgets
          key: namespace-widgets
        - displayName: Namespace Rollouts
          key: namespace-rollouts
  pages:
    - key: cluster-widgets
      type: crdTable
      crdTable:
        names:
          plural: clusterwidgets
          kind: ClusterWidget
        group: sample.frontend-forge.io
        version: v1alpha1
        scope: Cluster
        columns:
          - key: name
            title: NAME
            enableSorting: true
            render:
              type: text
              path: metadata.name
          - key: state
            title: STATE
            enableSorting: true
            render:
              type: text
              path: spec.state
          - key: owner
            title: OWNER
            render:
              type: text
              path: spec.owner
          - key: severity
            title: SEVERITY
            render:
              type: text
              path: spec.severity
          - key: creation-time
            title: CREATION_TIME
            enableHiding: true
            enableSorting: true
            render:
              type: time
              path: metadata.creationTimestamp
              format: local-datetime
    - key: cluster-reports
      type: crdTable
      crdTable:
        names:
          plural: clusterreports
          kind: ClusterReport
        group: sample.frontend-forge.io
        version: v1alpha1
        scope: Cluster
        columns:
          - key: name
            title: NAME
            enableSorting: true
            render:
              type: text
              path: metadata.name
          - key: state
            title: STATE
            render:
              type: text
              path: spec.state
          - key: owner
            title: OWNER
            render:
              type: text
              path: spec.owner
          - key: summary
            title: SUMMARY
            enableHiding: true
            render:
              type: text
              path: spec.summary
    - key: namespace-widgets
      type: crdTable
      crdTable:
        names:
          plural: namespacewidgets
          kind: NamespaceWidget
        group: sample.frontend-forge.io
        version: v1alpha1
        scope: Namespaced
        columns:
          - key: name
            title: NAME
            enableSorting: true
            render:
              type: text
              path: metadata.name
          - key: namespace
            title: NAMESPACE
            render:
              type: text
              path: metadata.namespace
          - key: state
            title: STATE
            render:
              type: text
              path: spec.state
          - key: replicas
            title: REPLICAS
            render:
              type: text
              path: spec.replicas
    - key: namespace-rollouts
      type: crdTable
      crdTable:
        names:
          plural: namespacerollouts
          kind: NamespaceRollout
        group: sample.frontend-forge.io
        version: v1alpha1
        scope: Namespaced
        columns:
          - key: name
            title: NAME
            enableSorting: true
            render:
              type: text
              path: metadata.name
          - key: namespace
            title: NAMESPACE
            render:
              type: text
              path: metadata.namespace
          - key: state
            title: STATE
            render:
              type: text
              path: spec.state
          - key: strategy
            title: STRATEGY
            render:
              type: text
              path: spec.strategy
  builder:
    engineVersion: v1
