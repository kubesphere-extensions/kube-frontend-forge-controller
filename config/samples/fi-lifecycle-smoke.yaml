apiVersion: frontend-forge.kubesphere.io/v1alpha1
kind: FrontendIntegration
metadata:
  name: fi-lifecycle-smoke
  annotations:
    kubesphere.io/description: FrontendIntegration lifecycle smoke test
spec:
  displayName: FI Lifecycle Smoke
  enabled: true
  menus:
    - displayName: Lifecycle Smoke
      key: lifecycle-smoke
