[package]
name = "frontend-forge-controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
chrono.workspace = true
futures.workspace = true
frontend-forge-api = { path = "../api" }
frontend-forge-common = { path = "../common" }
frontend-forge-extension-package-core = { path = "../extension-package-core" }
frontend-forge-manifest = { path = "../manifest" }
k8s-openapi.workspace = true
kube = { workspace = true, features = ["admission", "client", "ring", "rustls-tls"] }
kube-runtime.workspace = true
rustls.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "fi-to-fe-migrator"
path = "src/bin/fi_to_fe_migrator/main.rs"
