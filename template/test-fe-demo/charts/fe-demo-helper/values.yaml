# Default values for horizontal-pod-autoscaler-helper.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


roleTemplate:
  enabled: true
  # Shared role Categories are applied by a pre-install/pre-upgrade hook Job
  # instead of being Helm release resources, so concurrent extension releases
  # never race on Helm ownership. The registry falls back to
  # global.imageRegistry, then docker.io.
  categoryInstaller:
    image:
      registry: ""
      repository: kubesphere/kubectl
      tag: v1.27.16
      pullPolicy: IfNotPresent
