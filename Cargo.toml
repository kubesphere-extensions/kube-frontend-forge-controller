[workspace]
members = [
  "crates/api",
  "crates/build-service-client",
  "crates/common",
  "crates/extension-package-core",
  "crates/extension-packager",
  "crates/extension-publisher",
  "crates/frontend-extension-controller",
  "crates/frontend-forge-controller",
  "crates/frontend-forge-extension-api",
  "crates/frontend-forge-runner",
  "crates/manifest",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8.8"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
include_dir = "0.7"
k8s-openapi = { version = "0.27", features = ["latest"] }
kube = { version = "3.0.1", default-features = false }
kube-runtime = "3.0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2.1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
sha2 = "0.10"
snafu = "0.9"
tar = "0.4"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
