pre-commit:
  commands:
    gen-crd:
      run: cargo xtask gen-crd
      stage_fixed: true

pre-push:
  commands:
    gen-crd:
      run: cargo xtask gen-crd && git diff --exit-code -- config/charts/frontend-forge/crds/frontend-forge.kubesphere.io_frontendintegrations.yaml config/charts/frontend-forge/crds/frontend-forge.kubesphere.io_frontendextensions.yaml
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    fmt:
      run: cargo fmt --all -- --check
